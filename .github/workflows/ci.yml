name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  # ---------------- Setup Job ----------------
  setup:
    name: Setup Node & Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.key }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 1: compute deterministic key
      - name: Compute Cache Key
        id: key
        run: echo "key=node-modules-$(sha256sum package-lock.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # Step 2: attempt cache restore
      - name: Restore Cache
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ steps.key.outputs.key }}

      # Step 3: if cache miss, install deps
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

  # ------------ Format Check --------------
  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: npx prettier --check 'src/**/*.ts'

  # ------------ Lint Check --------------
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: npx eslint 'src/**/*.ts'

  # ------------- Types Check --------------
  types:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: npx tsc --noEmit

  # ------------ Unit tests --------------
  tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: npm test
