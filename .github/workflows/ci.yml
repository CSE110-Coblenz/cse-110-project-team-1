name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  # ----------------- Setup Job -----------------
  setup:
    name: Setup Node & Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline

  # ----------------- Formatting Job -----------------
  format:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ needs.setup.outputs.cache-key }}
      - run: npx prettier --check 'src/**/*.ts'

  # ----------------- ESLint Job -----------------
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ needs.setup.outputs.cache-key }}
      - run: npx eslint 'src/**/*.ts'

  # ----------------- Type Checking Job -----------------
  types:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ needs.setup.outputs.cache-key }}
      - run: npx tsc --noEmit

  # ----------------- Unit Tests Job -----------------
  tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ needs.setup.outputs.cache-key }}
      - run: npm test
